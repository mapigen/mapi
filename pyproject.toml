[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapi"
version = "0.1.0"
description = "Universal API client SDK"
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.19",
    "niquests>=3.15",
    "zstandard>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
